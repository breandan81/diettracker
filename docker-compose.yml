# Optional local Postgres for multi-user dev (requires Docker).
#   docker compose up -d
#   export DATABASE_URL=postgresql+psycopg://trend:trend@127.0.0.1:5433/trend_multi
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trend
      POSTGRES_PASSWORD: trend
      POSTGRES_DB: trend_multi
    ports:
      - "5433:5432"
    volumes:
      - trend_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trend -d trend_multi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trend_pgdata:
